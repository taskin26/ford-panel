name: APK derle
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: APK derle
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: APK yukle (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: FORD-app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: APK'yi herkese acik Release'e koy (giris istemez)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk >/dev/null 2>&1 || \
            gh release create apk --title "FORD APK (son surum)" \
              --notes "Teype/taba giris yapmadan kurmak icin dogrudan indirme." --latest
          gh release upload apk app/build/outputs/apk/debug/app-debug.apk --clobber
