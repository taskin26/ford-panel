plugins { id 'com.android.application' }
android {
    namespace 'com.ford.panel'
    compileSdk 34
    defaultConfig {
        applicationId "com.ford.panel"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }
    signingConfigs {
        debug {
            storeFile file('ford-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
dependencies { }
